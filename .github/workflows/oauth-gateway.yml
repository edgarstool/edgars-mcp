name: OAuth gateway

on:
  pull_request:
    paths:
      - "cloudflare/oauth-gateway/**"
      - ".github/workflows/oauth-gateway.yml"
  push:
    branches: [master]
    paths:
      - "cloudflare/oauth-gateway/**"
      - ".github/workflows/oauth-gateway.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/oauth-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloudflare/oauth-gateway/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run deploy:dry
