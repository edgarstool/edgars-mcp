[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "edgars-mcp"
version = "1.0.0"
description = "Edgar's cross-platform MCP tool gateway"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Edgar's Tool"}]
dependencies = []

[project.optional-dependencies]
access = ["PyJWT[crypto]>=2.8,<3"]
browser = ["playwright>=1.51,<2"]
all = ["PyJWT[crypto]>=2.8,<3", "playwright>=1.51,<2"]

[project.scripts]
edgars-mcp = "edgars_mcp.http_server:main"
edgars-mcp-stdio = "edgars_mcp.stdio_server:main"
edgars-mcp-proxy = "edgars_mcp.stdio_proxy:main"
edgars-mcp-hermes-proxy = "edgars_mcp.hermes_stdio_proxy:main"

[tool.setuptools.packages.find]
where = ["src"]
