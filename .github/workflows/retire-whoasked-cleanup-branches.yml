name: Retire whoasked cleanup branches

on:
  push:
    paths:
      - .github/workflows/retire-whoasked-cleanup-branches.yml

permissions:
  contents: write

jobs:
  delete-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete authorized cleanup branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branches=(
            'prelaunch/milestone-edg-322-20260827'
            'work/edg2-18-gmail-export-webhook'
            'prelaunch/packaging-gate-20260828'
            'prelaunch/edg-322-environment-validation-20260829'
          )
          for branch in "${branches[@]}"; do
            echo "Deleting ${branch}"
            gh api -X DELETE "repos/${GH_REPO}/git/refs/heads/${branch}"
            if gh api "repos/${GH_REPO}/git/ref/heads/${branch}" >/dev/null 2>&1; then
              echo "Branch still exists: ${branch}" >&2
              exit 1
            fi
            echo "Deleted and read-back confirmed: ${branch}"
          done
